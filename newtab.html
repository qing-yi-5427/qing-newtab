<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0c29">
  <meta name="color-scheme" content="dark light">
  <title>qing-newtab</title>
  <link rel="stylesheet" href="newtab.css">
  <!-- Local external script: MV3 blocks inline JavaScript on extension pages. -->
  <script src="theme-init.js"></script>
</head>
<body>
  <div id="wallpaper"></div>
  <div id="overlay"></div>
  <div id="scrim"></div>

  <main id="content">
    <section id="clock-section">
      <div id="time">00:00</div>
      <div id="date"></div>
    </section>

    <section id="input-row" aria-label="搜索与快速对话">
    <section id="search-section">
      <div class="search-heading"><span>搜索</span></div>
      <form id="search-form" role="search">
        <input type="text" id="search-input" placeholder="搜索网站、书签或输入网址" autocomplete="off" spellcheck="false" aria-label="搜索网站、书签或输入网址" aria-controls="local-search-results" aria-expanded="false" aria-keyshortcuts="Control+F Meta+F Control+K Meta+K /">
        <div id="engine-wrap">
          <button type="button" id="engine-switch" class="engine-switch" aria-haspopup="true" aria-expanded="false" aria-label="搜索引擎">B</button>
          <div id="engine-menu" class="engine-menu hidden" role="menu" aria-label="选择搜索引擎">
            <button type="button" class="engine-option active" role="menuitemradio" aria-checked="true" data-engine="bing">Bing</button>
            <button type="button" class="engine-option" role="menuitemradio" aria-checked="false" data-engine="google">Google</button>
            <button type="button" class="engine-option" role="menuitemradio" aria-checked="false" data-engine="custom">自定义</button>
          </div>
        </div>
        <button type="submit" id="search-btn" aria-label="搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </form>
      <div id="local-search-results" class="local-search-results hidden" role="listbox" aria-label="本地搜索结果"></div>
    </section>

    <section id="assistant-section" aria-labelledby="assistant-title">
      <div class="assistant-heading">
        <div id="assistant-provider-wrap" class="assistant-provider-wrap">
          <button id="assistant-provider-switch" class="assistant-provider-switch" type="button" aria-haspopup="true" aria-expanded="false" aria-label="对话供应商">
            <span id="assistant-title">DeepSeek</span>
          </button>
          <div id="assistant-provider-menu" class="engine-menu assistant-provider-menu hidden" role="menu" aria-label="选择对话供应商">
            <button type="button" class="engine-option assistant-provider-option" role="menuitemradio" aria-checked="true" data-provider="deepseek">DeepSeek</button>
            <button type="button" class="engine-option assistant-provider-option" role="menuitemradio" aria-checked="false" data-provider="kimi">Kimi</button>
            <button type="button" class="engine-option assistant-provider-option" role="menuitemradio" aria-checked="false" data-provider="mimo">MiMo</button>
            <button type="button" class="engine-option assistant-provider-option" role="menuitemradio" aria-checked="false" data-provider="glm">智谱清言</button>
            <button type="button" class="engine-option assistant-provider-option" role="menuitemradio" aria-checked="false" data-provider="api">自定义接口</button>
          </div>
        </div>
        <div class="assistant-actions">
          <button id="assistant-clear" class="text-action hidden" type="button">清空</button>
          <a id="assistant-web" class="text-action hidden" target="_blank" rel="noopener noreferrer">打开网页版</a>
        </div>
      </div>
      <div id="assistant-messages" class="assistant-messages hidden" aria-live="polite"></div>
      <form id="assistant-form">
        <textarea id="assistant-input" rows="1" maxlength="8000" placeholder="向大模型提问，回车发送" aria-label="向大模型提问"></textarea>
        <button id="assistant-send" type="submit" aria-label="发送">发送</button>
      </form>
      <p id="assistant-status" class="assistant-status" role="status" aria-live="polite"></p>
    </section>
    </section>

    <section id="home-dashboard">
      <section id="shortcuts-section" class="home-section" aria-labelledby="shortcuts-title">
        <div class="section-heading">
          <h2 id="shortcuts-title">快捷方式</h2>
        </div>
        <div id="tab-shortcuts">
          <div id="shortcuts-grid" title="右键空白处添加快捷方式"></div>
        </div>
      </section>

      <section id="bookmarks-section" class="home-section" aria-labelledby="bookmarks-title">
        <div class="section-heading">
          <h2 id="bookmarks-title">书签</h2>
          <span id="bookmarks-count"></span>
        </div>
        <div id="bookmarks-tree"></div>
      </section>
    </section>
  </main>

  <div id="context-menu" class="context-menu hidden" role="menu" aria-label="页面菜单">
    <button id="context-open-bookmark" class="hidden" type="button" role="menuitem">在新标签页打开</button>
    <button id="context-edit-bookmark" class="hidden" type="button" role="menuitem">编辑书签</button>
    <button id="context-rename-bookmark-folder" class="hidden" type="button" role="menuitem">重命名文件夹</button>
    <button id="context-delete-bookmark" class="hidden danger-menu-item" type="button" role="menuitem">删除书签</button>
    <div id="context-bookmark-separator" class="context-menu-separator hidden" role="separator"></div>
    <button id="context-edit-shortcut" class="hidden" type="button" role="menuitem">编辑快捷方式</button>
    <button id="context-add-shortcut" type="button" role="menuitem">添加快捷方式</button>
    <button id="context-finish-managing" class="hidden" type="button" role="menuitem">完成整理</button>
    <button id="context-undo-shortcut" type="button" role="menuitem">撤销快捷方式变更</button>
    <div class="context-menu-separator" role="separator"></div>
    <button id="context-history" type="button" role="menuitem">历史记录</button>
    <button id="context-downloads" type="button" role="menuitem">下载内容</button>
    <button id="context-favorites" type="button" role="menuitem">书签管理</button>
    <button id="context-extensions" type="button" role="menuitem">扩展管理</button>
    <div class="context-menu-separator" role="separator"></div>
    <button id="context-settings" type="button" role="menuitem">设置</button>
    <div class="context-menu-separator" role="separator"></div>
    <button id="context-export-backup" type="button" role="menuitem">导出配置备份</button>
    <button id="context-import-backup" type="button" role="menuitem">导入配置备份</button>
  </div>

  <div id="page-toast" class="page-toast hidden" role="status" aria-live="polite"></div>

  <div id="bookmark-editor-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="bookmark-editor-title">
    <form id="bookmark-editor-form" class="modal-content bookmark-editor-modal">
      <div class="settings-header">
        <h3 id="bookmark-editor-title">编辑书签</h3>
        <button id="bookmark-editor-close" class="modal-close" type="button" aria-label="关闭书签编辑窗口">&times;</button>
      </div>
      <label class="editor-field">
        <span>名称</span>
        <input id="bookmark-editor-name" type="text" maxlength="255" autocomplete="off" required>
      </label>
      <label id="bookmark-editor-url-row" class="editor-field">
        <span>网址</span>
        <input id="bookmark-editor-url" type="text" inputmode="url" autocomplete="off" required>
      </label>
      <div class="modal-actions">
        <button id="bookmark-editor-cancel" type="button">取消</button>
        <button id="bookmark-editor-save" type="submit">保存</button>
      </div>
    </form>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-content settings-modal">
      <div class="settings-header">
        <h3 id="settings-title">设置</h3>
        <button id="settings-close" class="modal-close" aria-label="关闭设置">&times;</button>
      </div>

      <div class="prefs-section">
        <h4 class="prefs-title">偏好设置</h4>

        <div class="pref-row">
          <span class="pref-label" id="pref-theme-label">主题</span>
          <div class="segmented" role="radiogroup" aria-labelledby="pref-theme-label">
            <button type="button" class="seg-btn pref-theme-btn" data-theme-mode="system" role="radio" aria-checked="true">跟随系统</button>
            <button type="button" class="seg-btn pref-theme-btn" data-theme-mode="light" role="radio" aria-checked="false">浅色</button>
            <button type="button" class="seg-btn pref-theme-btn" data-theme-mode="dark" role="radio" aria-checked="false">深色</button>
          </div>
        </div>

        <div class="pref-row">
          <label class="pref-label" for="wallpaper-source">背景壁纸</label>
          <select id="wallpaper-source" class="pref-select">
            <option value="bing">必应每日壁纸</option>
            <option value="custom">自定义壁纸</option>
            <option value="gradient">纯色渐变</option>
          </select>
        </div>

        <div class="pref-row" id="custom-wallpaper-row">
          <span class="pref-label">自定义图片</span>
          <div class="inline-actions">
            <button id="custom-wallpaper-choose" class="secondary-btn" type="button">选择图片</button>
            <button id="custom-wallpaper-clear" class="secondary-btn" type="button">移除</button>
            <input id="custom-wallpaper-file" type="file" accept="image/*" hidden>
          </div>
        </div>

        <label class="pref-row range-row" for="wallpaper-blur">
          <span class="pref-label">背景模糊 <output id="wallpaper-blur-value">0</output></span>
          <input id="wallpaper-blur" type="range" min="0" max="20" step="1">
        </label>

        <label class="pref-row range-row" for="wallpaper-dim">
          <span class="pref-label">背景变暗 <output id="wallpaper-dim-value">45%</output></span>
          <input id="wallpaper-dim" type="range" min="0" max="75" step="1">
        </label>

        <label class="pref-row range-row" for="glass-blur">
          <span class="pref-label">面板清晰度 <output id="glass-blur-value">10</output></span>
          <input id="glass-blur" type="range" min="0" max="30" step="1">
        </label>

        <div class="pref-row">
          <label class="pref-label" id="pref-engine-label" for="engine-select">搜索引擎</label>
          <select id="engine-select" class="pref-select" aria-labelledby="pref-engine-label">
            <option value="bing">Bing</option>
            <option value="google">Google</option>
            <option value="custom">自定义</option>
          </select>
        </div>

        <div class="pref-row" id="custom-engine-row">
          <label class="pref-label" for="custom-engine-input">自定义搜索地址</label>
          <input type="text" id="custom-engine-input" class="pref-input" placeholder="https://example.com/search?q=%s" aria-label="自定义搜索地址">
        </div>

        <div class="pref-row">
          <span class="pref-label" id="pref-icon-label">快捷方式图标</span>
          <div class="segmented" role="radiogroup" aria-labelledby="pref-icon-label">
            <button type="button" class="seg-btn pref-icon-btn" data-icon-mode="letter" role="radio" aria-checked="false">首字母</button>
            <button type="button" class="seg-btn pref-icon-btn" data-icon-mode="favicon" role="radio" aria-checked="true">网站图标</button>
          </div>
        </div>

        <div class="pref-row">
          <span class="pref-label">快捷方式布局</span>
          <div class="shortcut-layout-controls">
            <label>列数
              <select id="shortcut-columns" class="pref-select compact-select" aria-label="快捷方式列数">
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12" selected>12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
              </select>
            </label>
            <label>行数
              <select id="shortcut-rows" class="pref-select compact-select" aria-label="快捷方式行数">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
          </div>
        </div>

        <div class="pref-row">
          <span class="pref-label">首页显示</span>
          <div class="pref-checks">
            <label><input id="show-clock" type="checkbox" checked> 时间</label>
            <label><input id="show-assistant" type="checkbox" checked> 快速对话</label>
            <label><input id="show-bookmarks" type="checkbox" checked> 书签</label>
          </div>
        </div>

        <div class="pref-row">
          <label class="pref-label" for="home-order">内容顺序</label>
          <select id="home-order" class="pref-select">
            <option value="shortcuts-first">快捷方式在前</option>
            <option value="bookmarks-first">书签在前</option>
          </select>
        </div>

        <div class="pref-row">
          <label class="pref-label" for="content-density">显示密度</label>
          <select id="content-density" class="pref-select">
            <option value="standard">标准</option>
            <option value="compact">紧凑</option>
          </select>
        </div>
      </div>

      <div class="prefs-section">
        <h4 class="prefs-title">快速对话</h4>
        <label class="settings-field">
          <span>发送到</span>
          <select id="llm-provider" class="pref-select">
            <option value="deepseek">DeepSeek 网页（自动发送）</option>
            <option value="kimi">Kimi 网页（自动发送）</option>
            <option value="mimo">MiMo 网页（自动发送）</option>
            <option value="glm">智谱清言网页（自动发送）</option>
            <option value="api">自定义接口</option>
          </select>
        </label>
        <div id="llm-api-settings" class="settings-fields hidden">
          <label class="settings-field">
            <span>接口地址</span>
            <input id="llm-base-url" class="pref-input" type="url" placeholder="https://api.example.com/v1">
          </label>
          <label class="settings-field">
            <span>密钥</span>
            <input id="llm-api-key" class="pref-input" type="password" autocomplete="off" placeholder="仅保存在本机">
          </label>
          <label class="settings-field">
            <span>模型</span>
            <input id="llm-model" class="pref-input" type="text" placeholder="例如 gpt-4o-mini">
          </label>
          <label class="settings-field">
            <span>备用网页地址（可选）</span>
            <input id="llm-web-url" class="pref-input" type="url" placeholder="https://example.com/">
          </label>
          <p class="settings-note">支持兼容 OpenAI 对话接口的服务。密钥仅保存在浏览器本地。</p>
        </div>
        <p id="llm-web-note" class="settings-note">发送时会打开所选网站，并自动提交输入内容；需要先在该网站登录。</p>
      </div>

      <div class="prefs-section">
        <h4 class="prefs-title">数据</h4>
        <div class="data-actions">
          <button id="settings-sync" class="secondary-btn" type="button" aria-pressed="false">开启浏览器同步</button>
          <button id="settings-restore-snapshot" class="secondary-btn" type="button">恢复上一次变更</button>
          <button id="settings-export" class="secondary-btn" type="button">导出设置</button>
          <button id="settings-import" class="secondary-btn" type="button">导入设置</button>
          <button id="settings-clear-cache" class="secondary-btn" type="button">清理缓存</button>
          <input id="settings-import-file" type="file" hidden>
        </div>
        <p class="settings-note">同步只包含普通设置和快捷方式；密钥、壁纸和本地图标图片不会同步。快捷方式中的内网网址会随配置同步。</p>
        <p id="data-status" class="data-status" role="status" aria-live="polite"></p>
      </div>

      <div class="modal-actions">
        <button id="settings-done" type="button">完成</button>
      </div>
    </div>
  </div>

  <div id="shortcut-folder-modal" class="modal shortcut-folder-modal hidden" role="dialog" aria-modal="true" aria-label="快捷方式文件夹">
    <div id="shortcut-folder-window" class="modal-content shortcut-folder-window">
      <div class="shortcut-folder-header">
        <input id="shortcut-folder-name" type="text" maxlength="32" aria-label="文件夹名称">
        <div class="shortcut-folder-actions">
          <button id="shortcut-folder-add" type="button">添加</button>
          <button id="shortcut-folder-close" class="modal-close" type="button" aria-label="关闭文件夹">&times;</button>
        </div>
      </div>
      <p class="shortcut-folder-hint">拖动图标排序；拖到窗口外移回首页</p>
      <div id="shortcut-folder-grid" aria-label="文件夹内容"></div>
    </div>
  </div>

  <div id="shortcut-editor-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="shortcut-editor-title">
    <form id="shortcut-editor-form" class="modal-content shortcut-editor-modal">
      <div class="settings-header">
        <h3 id="shortcut-editor-title">添加快捷方式</h3>
        <button id="shortcut-editor-close" class="modal-close" type="button" aria-label="关闭编辑窗口">&times;</button>
      </div>

      <button id="shortcut-editor-icon" class="shortcut-editor-icon" type="button" title="选择自定义图标">
        <span id="shortcut-editor-icon-preview" aria-hidden="true"></span>
        <span class="shortcut-editor-icon-hint">更换图标</span>
      </button>
      <button id="shortcut-editor-icon-reset" class="text-button hidden" type="button">恢复网站图标</button>

      <label class="editor-field">
        <span>名称</span>
        <input id="shortcut-editor-name" type="text" maxlength="64" autocomplete="off" required placeholder="例如：视频网站">
      </label>
      <label class="editor-field">
        <span>网址</span>
        <input id="shortcut-editor-url" type="text" inputmode="url" autocomplete="off" required placeholder="https://example.com">
      </label>

      <div class="modal-actions shortcut-editor-actions">
        <button id="shortcut-editor-delete" class="danger-btn hidden" type="button">删除</button>
        <span class="action-spacer"></span>
        <button id="shortcut-editor-cancel" type="button">取消</button>
        <button id="shortcut-editor-save" type="submit">保存</button>
      </div>
    </form>
  </div>

  <!-- Icon preview modal (replaces the old canvas crop modal) -->
  <div id="icon-preview-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="icon-preview-title">
    <div class="modal-content icon-preview-modal">
      <h3 id="icon-preview-title">图标预览</h3>
      <div class="icon-preview-box">
        <img id="icon-preview-img" alt="图标预览">
      </div>
      <div class="modal-actions">
        <button id="icon-preview-cancel" type="button">取消</button>
        <button id="icon-preview-save" type="button">应用</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
